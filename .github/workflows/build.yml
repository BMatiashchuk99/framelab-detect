name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to create from this commit, e.g. v1.2.0 (empty: build only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      actions: read   # SignPath reads the uploaded artifact
    env:
      # A release comes from a pushed v* tag, or from a manual run with the "release" input (which creates the tag).
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release }}
    steps:
      - name: Check the release tag
        if: env.RELEASE != ''
        run: echo "$RELEASE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Release tag must look like v1.2.3"; exit 1; }

      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build
        run: ./build.sh

      - name: Upload the unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FrameLab-Detect
          path: dist/FrameLab-Detect.exe
          if-no-files-found: error

      # Code signing through SignPath Foundation, see "Code signing policy" in README.md.
      # Runs for release tags once the repository has the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID
      # variable. Every request waits until an approver confirms it in SignPath.
      - name: Sign with SignPath
        if: env.RELEASE != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: framelab-detect
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish the release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=dist/FrameLab-Detect.exe
          if [ -f signed/FrameLab-Detect.exe ]; then file=signed/FrameLab-Detect.exe; fi
          mkdir -p release && cp "$file" release/FrameLab-Detect.exe
          (cd release && sha256sum FrameLab-Detect.exe > FrameLab-Detect.exe.sha256)
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" release/FrameLab-Detect.exe release/FrameLab-Detect.exe.sha256 --clobber
          else
            gh release create "$RELEASE" release/FrameLab-Detect.exe release/FrameLab-Detect.exe.sha256 \
              --target "$GITHUB_SHA" --title "FrameLab Detect $RELEASE" --generate-notes
          fi
